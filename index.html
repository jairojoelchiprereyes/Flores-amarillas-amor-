<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un detalle para ti 🌻</title>
<style>
html,body{margin:0;height:100%;font-family:Segoe UI,sans-serif;overflow:hidden}
#cover,#garden{position:fixed;inset:0}
#cover{
display:flex;flex-direction:column;justify-content:center;align-items:center;
background:linear-gradient(#8fd3ff,#fff7c8,#9dd67d);text-align:center;
transition:opacity .8s;
}
h1{font-size:2.2rem;margin:0;color:#5b4a12}
p{max-width:320px;color:#4c5a43}
button{padding:14px 24px;border:0;border-radius:20px;background:#ffd84d;font-weight:bold;font-size:1rem}
#garden{display:none;background:linear-gradient(#87CEEB,#E0F6FF 60%,#90EE90)}
.flower{position:absolute;transform:translate(-50%,-50%);text-align:center}
.f{font-size:3rem}
.card{max-width:220px;background:#fff;border:2px solid #f1c40f;border-radius:14px;padding:8px;margin-top:4px}
</style>
</head>
<body>
<div id="cover">
<h1>🌻 Tengo algo para ti 💛</h1>
<p>He preparado un pequeño jardín. Cada toque hará aparecer una flor con un mensaje especial.</p>
<button onclick="startGarden()">Entrar al jardín ✨</button>
</div>

<div id="garden"></div>

<script>
const frases = [
"Gracias por estos 6 meses tan bonitos juntos 💛",
"Me encanta tenerte en mi vida 🌻",
"Hay momentos contigo que podría recordar una y otra vez ✨",
"Hoy te extraño un poquito más de lo normal 🥺",
"Confía en ti, tienes más fuerza de la que imaginas 💪",
"Qué bonito es compartir mi vida contigo 💕",
"Cada salida y cada risa tiene un lugar especial 💛",
"Espero que todavía nos queden muchas historias por vivir 🌎",
"Tu sonrisa alegra mis días 😊",
"Por muchos meses más de risas y abrazos 🌻"
];
const flores=["🌻","🌼","🌷","🌾"];
let i=0;

function startGarden(){
 document.getElementById('cover').style.opacity='0';
 setTimeout(()=>{
  document.getElementById('cover').style.display='none';
  document.getElementById('garden').style.display='block';
 },700);
}

document.getElementById('garden').addEventListener('click',e=>{
 const d=document.createElement('div');
 d.className='flower';
 d.style.left=e.clientX+'px';
 d.style.top=e.clientY+'px';
 d.innerHTML=`<div class="f">${flores[Math.floor(Math.random()*flores.length)]}</div>
 <div class="card">${frases[i]}</div>`;
 document.getElementById('garden').appendChild(d);
 i=(i+1)%frases.length;
});
</script>
</body>
</html>
